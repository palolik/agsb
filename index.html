<!DOCTYPE html>
<html lang="bn" data-theme="agsb">
  <head>
    <!-- Apply the saved theme (or the OS setting) before first paint. Keep in
         sync with src/context/ThemeContext.jsx. -->
    <script>
      (function () {
        var mode = null;
        try { mode = localStorage.getItem("agsb_theme"); } catch (e) {}
        if (mode !== "light" && mode !== "dark") {
          mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", mode === "light" ? "agsb-light" : "agsb");
        // Language (keep in sync with src/context/LanguageContext.jsx).
        var lang;
        try { lang = localStorage.getItem("agsb_lang"); } catch (e) {}
        if (lang === "en") document.documentElement.lang = "en";
        // The app is about to render: hide the plain-HTML page copy that
        // scripts/build-seo.mjs puts in #root for crawlers.
        document.documentElement.classList.add("js");
      })();
    </script>
    <style>.js .prerender { display: none; }</style>
